      <text x="56" y="260" font-size="11" fill="#56627a" font-weight="400">p=5</text>
      <rect x="146" y="228" width="300" height="16" rx="3" fill="#e9edf5" />
      <rect x="146" y="228" width="200" height="16" rx="3" fill="#315cce" />
      <text x="454" y="241" font-size="15" fill="#315cce" font-weight="700">2</text>
      <text x="146" y="261" font-size="11" fill="#56627a" font-weight="400">quota 20/9 ≈ 2.22</text>
    </g>
    <g>
      <title>G1; population 5; exact quota 25/9; seats 3; deviation 2/9</title>
