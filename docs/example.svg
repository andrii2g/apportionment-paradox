<svg width="1200" height="1072" viewBox="0 0 1200 1072" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Apportionment: one extra seat</title>
  <desc id="description">Consecutive house sizes compared using exact allocation arithmetic. Red bars and explicit loss labels identify groups losing seats. Ties favor original input order.</desc>
  <rect x="0" y="0" width="1200" height="1072" rx="0" fill="#f3f5fa" />
  <text x="32" y="48" font-size="30" fill="#17243c" font-weight="700">One extra seat. An unexpected loss.</text>
  <text x="32" y="80" font-size="16" fill="#56627a" font-weight="400">Hamilton, Jefferson, Webster · exact quotas · deterministic input-order ties</text>
  <text x="32" y="113" font-size="14" fill="#56627a" font-weight="400">House 4 → 5   |   Shared bar scale: 0–3 seats   |   Red + loss labels = fewer seats</text>
