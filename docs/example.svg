    <text x="56" y="182" font-size="21" fill="#17243c" font-weight="700">Hamilton</text>
    <text x="650" y="182" font-size="14" fill="#bc3048" font-weight="600">1 group(s) lose seats</text>
    <text x="56" y="210" font-size="12" fill="#56627a" font-weight="600">BEFORE · 4 seats</text>
    <text x="650" y="210" font-size="12" fill="#56627a" font-weight="600">AFTER · 5 seats</text>
    <line x1="600" x2="600" y1="200" y2="408" stroke="#e5e9f2" />
    <g>
